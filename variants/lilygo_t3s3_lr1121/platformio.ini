[env:LilyGo_T3S3_lr1121_subghz_companion_radio_usb]
extends = LilyGo_T3S3_lr1121_subghz
build_flags =
  ${LilyGo_T3S3_lr1121_subghz.build_flags}
  -D MAX_CONTACTS=350
