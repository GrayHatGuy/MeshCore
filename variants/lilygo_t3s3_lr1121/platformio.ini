; =====================================================================================
;  LilyGo T3S3 v1.3 with LR1121 (multi-band LoRa)
;
;  The LR1121 is multi-band. Two plan families are provided over the same hardware:
;    - [LilyGo_T3S3_lr1121]         2.4 GHz  (2450 / 812.5 / SF10, high-band path)
;    - [LilyGo_T3S3_lr1121_subghz]  US 915   (910.525 / 62.5 / SF7, sub-GHz path)
;  radio_init() in target.cpp selects high/low band automatically from LORA_FREQ.
;  Headless builds (BLE / USB companion + repeater); no on-device display driver.
;  NOTE: the LR1121 RF-switch table (target.cpp) is best-effort and should be
;  confirmed on hardware for BOTH bands (sub-GHz RX/TX_HP and 2.4 GHz TX_HF paths).
;
;  Environments (6):
;    2.4 GHz:     LilyGo_T3S3_lr1121_companion_radio_ble
;                 LilyGo_T3S3_lr1121_companion_radio_usb
;                 LilyGo_T3S3_lr1121_repeater
;    US sub-GHz:  LilyGo_T3S3_lr1121_subghz_companion_radio_ble
;                 LilyGo_T3S3_lr1121_subghz_companion_radio_usb
;                 LilyGo_T3S3_lr1121_subghz_repeater
;  (_ble = phone app over Bluetooth, PIN 123456; _usb = USB-serial companion)
; =====================================================================================

; ---- shared hardware (pins / radio class / TCXO), band-independent ----
[lr1121_t3s3_hw]
build_flags =
  -I variants/lilygo_t3s3_lr1121
  -D LILYGO_T3S3_LR1121
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=17
  ; --- LR1121 pin wiring (T3S3 v1.3) ---
  -D P_LORA_NSS=7
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=3
  -D P_LORA_MOSI=6
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=34
  -D P_LORA_DIO_1=36           ; radio IRQ
  -D LR11X0_DIO3_TCXO_VOLTAGE=3.0
  -D USE_LR1121
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper

; ---- 2.4 GHz plan (default) ----
[LilyGo_T3S3_lr1121]
extends = esp32_base
board = t3_s3_v1_x
build_flags =
  ${esp32_base.build_flags}
  ${lr1121_t3s3_hw.build_flags}
  -D LORA_TX_POWER=13          ; LR1121 2.4 GHz PA maxes at ~+13 dBm
  ; --- default 2.4 GHz frequency plan ---
  -D LORA_FREQ=2450.0
  -D LORA_BW=812.5
  -D LORA_SF=10
  -D LORA_CR=5
  -D LORA_PREAMBLE=12
  -D LORA_MAX_BW=1700.0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t3s3_lr1121>
lib_deps =
  ${esp32_base.lib_deps}

; ---- US 915 sub-GHz plan (matches the MeshCore "USA" preset) ----
[LilyGo_T3S3_lr1121_subghz]
extends = esp32_base
board = t3_s3_v1_x
build_flags =
  ${esp32_base.build_flags}
  ${lr1121_t3s3_hw.build_flags}
  -D LORA_TX_POWER=20          ; sub-GHz HP PA
  ; --- default US sub-GHz frequency plan ---
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  ; preamble intentionally left unset -> MeshCore default (16) for fleet interop.
  ; no LORA_MAX_BW needed (62.5 kHz is under the default 500 cap).
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t3s3_lr1121>
lib_deps =
  ${esp32_base.lib_deps}

; =====================================================================================
;  Environments
; =====================================================================================

; ---- 2.4 GHz ----
[env:LilyGo_T3S3_lr1121_companion_radio_ble]
extends = LilyGo_T3S3_lr1121
build_flags =
  ${LilyGo_T3S3_lr1121.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
build_src_filter = ${LilyGo_T3S3_lr1121.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${LilyGo_T3S3_lr1121.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_lr1121_companion_radio_usb]
extends = LilyGo_T3S3_lr1121
build_flags =
  ${LilyGo_T3S3_lr1121.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_T3S3_lr1121.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${LilyGo_T3S3_lr1121.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_lr1121_repeater]
extends = LilyGo_T3S3_lr1121
build_flags =
  ${LilyGo_T3S3_lr1121.build_flags}
  -D ADVERT_NAME='"T3S3 LR1121 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${LilyGo_T3S3_lr1121.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_T3S3_lr1121.lib_deps}
  ${esp32_ota.lib_deps}

; ---- US 915 sub-GHz ----
[env:LilyGo_T3S3_lr1121_subghz_companion_radio_ble]
extends = LilyGo_T3S3_lr1121_subghz
build_flags =
  ${LilyGo_T3S3_lr1121_subghz.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
build_src_filter = ${LilyGo_T3S3_lr1121_subghz.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${LilyGo_T3S3_lr1121_subghz.lib_deps}
  ${esp32_ota.lib_deps}
