; =====================================================================================
;  LilyGo T-Watch S3 family (T-Watch S3 + T-Watch S3 Plus)
;
;  - SX1262 envs  -> standard T-Watch S3 (sub-GHz LoRa, uses the repo default region plan)
;  - SX1280 envs  -> T-Watch S3 Plus / 2.4 GHz LoRa (defaults to the 2.4 GHz plan)
;  - Add -D T_WATCH_S3_PLUS (the *_Plus_* sections) to enable the on-board GPS.
;
;  Headless builds: the phone app (BLE) or serial is the UI; there is no on-device
;  screen/touch driver yet. The AXP2101 PMU rails are configured by TWatchS3Board so
;  the radio powers up.
;
;  Environments (8):
;    SX1262 (sub-GHz):  LilyGo_TWatch_S3_sx1262_companion_radio_ble
;                       LilyGo_TWatch_S3_sx1262_companion_radio_usb
;                       LilyGo_TWatch_S3_sx1262_repeater
;    SX1280 (2.4 GHz):  LilyGo_TWatch_S3_sx1280_companion_radio_ble
;                       LilyGo_TWatch_S3_sx1280_companion_radio_usb
;                       LilyGo_TWatch_S3_sx1280_repeater
;    Plus (+GPS):       LilyGo_TWatch_S3_Plus_sx1262_companion_radio_ble
;                       LilyGo_TWatch_S3_Plus_sx1280_companion_radio_ble
;  (_ble = phone app over Bluetooth, PIN 123456; _usb = USB-serial companion)
; =====================================================================================

[LilyGo_TWatch_S3_base]
extends = esp32_base
board = lilygo_t_watch_s3
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_twatch_s3
  -D LILYGO_TWATCH_S3
  -D TWATCH_INHIBIT_SLEEP=1    ; keep CPU awake so AXP ALDO4 (radio) is never gated; SX1280-safe (validation -- costs battery; clear to re-enable light sleep)
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
  -D PIN_USER_BTN=0           ; BOOT button
  -D PIN_BOARD_SDA=10         ; main I2C: AXP2101 PMU + PCF8563 RTC
  -D PIN_BOARD_SCL=11
  ; --- shared LoRa pin wiring (identical on S3 and S3 Plus) ---
  -D P_LORA_SCLK=3
  -D P_LORA_MISO=4
  -D P_LORA_MOSI=1
  -D P_LORA_NSS=5
  -D P_LORA_RESET=8
  -D P_LORA_DIO_1=9           ; radio IRQ
  -D P_LORA_BUSY=7
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_twatch_s3>
lib_deps =
  ${esp32_base.lib_deps}
  lewisxhe/XPowersLib@^0.2.7

; ---------------- SX1262 (sub-GHz, standard T-Watch S3) ----------------
[LilyGo_TWatch_S3_sx1262]
extends = LilyGo_TWatch_S3_base
build_flags =
  ${LilyGo_TWatch_S3_base.build_flags}
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=22

; ---------------- SX1280 (2.4 GHz, T-Watch S3 Plus / modded) ----------------
[LilyGo_TWatch_S3_sx1280]
extends = LilyGo_TWatch_S3_base
; The base flags exclude the SX128x driver; remove that flag so SX1280 is compiled.
; (build_unflags is reliable; a stray -U in build_flags gets reordered after the -D.)
build_unflags = -D RADIOLIB_EXCLUDE_SX128X=1
build_flags =
  ${LilyGo_TWatch_S3_base.build_flags}
  -D USE_SX1280
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper
  -D SX128X_RXEN=RADIOLIB_NC     ; RF switch handled on-chip (no external RX/TX EN pins)
  -D SX128X_TXEN=RADIOLIB_NC
  -D LORA_TX_POWER=13            ; SX1280 PA maxes at ~+12.5 dBm
  ; --- default 2.4 GHz frequency plan ---
  -D LORA_FREQ=2450.0
  -D LORA_BW=812.5
  -D LORA_SF=10
  -D LORA_CR=5
  -D LORA_PREAMBLE=12
  -D LORA_MAX_BW=1700.0          ; allow the wide 2.4 GHz bandwidths through validation

; ---------------- GPS overlays (T-Watch S3 Plus) ----------------
; These add the on-board GPS (the only functional delta of the Plus) on top of a radio.
[LilyGo_TWatch_S3_Plus_sx1262]
extends = LilyGo_TWatch_S3_sx1262
build_flags =
  ${LilyGo_TWatch_S3_sx1262.build_flags}
  -D T_WATCH_S3_PLUS
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=41              ; MCU RX  <- GPS TX  (swap with PIN_GPS_RX if no fix)
  -D PIN_GPS_RX=42             ; MCU TX  -> GPS RX
  -D GPS_BAUD_RATE=38400
build_src_filter = ${LilyGo_TWatch_S3_sx1262.build_src_filter}
  +<helpers/sensors/*.cpp>
lib_deps =
  ${LilyGo_TWatch_S3_sx1262.lib_deps}
  ${sensor_base.lib_deps}

[LilyGo_TWatch_S3_Plus_sx1280]
extends = LilyGo_TWatch_S3_sx1280
build_flags =
  ${LilyGo_TWatch_S3_sx1280.build_flags}
  -D T_WATCH_S3_PLUS
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=41              ; MCU RX  <- GPS TX  (swap with PIN_GPS_RX if no fix)
  -D PIN_GPS_RX=42             ; MCU TX  -> GPS RX
  -D GPS_BAUD_RATE=38400
build_src_filter = ${LilyGo_TWatch_S3_sx1280.build_src_filter}
  +<helpers/sensors/*.cpp>
lib_deps =
  ${LilyGo_TWatch_S3_sx1280.lib_deps}
  ${sensor_base.lib_deps}

; ---- on-board 1.54" ST7789 240x240 TFT (separate HSPI bus; backlight enable on GPIO45) ----
;  Geometry/scale/rotation are hardware-tune knobs -- verify on the watch and adjust.
[twatch_s3_tft]
build_flags =
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D PIN_TFT_CS=12
  -D PIN_TFT_DC=38
  -D PIN_TFT_RST=-1            ; reset via AXP ALDO3 power-cycle (no GPIO)
  -D PIN_TFT_SCL=18            ; display SPI SCLK (HSPI, separate from the LoRa bus)
  -D PIN_TFT_SDA=13            ; display SPI MOSI
  -D PIN_TFT_LEDA_CTL=45       ; backlight enable line (rail = AXP ALDO2)
  -D DISPLAY_WIDTH=240
  -D DISPLAY_HEIGHT=240
  -D DISPLAY_ROTATION=2        ; tune on hw (0-3)
  -D DISPLAY_SCALE_X=1.875     ; 240/128 logical-x (tune)
  -D DISPLAY_SCALE_Y=3.75      ; 240/64  logical-y (tune)
  ; --- FT6336 capacitive touch (own I2C bus Wire1, separate from the AXP2101/RTC bus) ---
  ; tap = wake / next page, touch-and-hold = enter / long-press (mapped like the button)
  -D TOUCH_FT6X36=1
  -D PIN_TOUCH_SDA=39
  -D PIN_TOUCH_SCL=40
  -D PIN_TOUCH_INT=16          ; touch IRQ (currently polled; reserved for future use)
  -D TOUCH_I2C_ADDR=0x38

; =====================================================================================
;  Environments
; =====================================================================================

; ---- SX1262 (sub-GHz) ----
[env:LilyGo_TWatch_S3_sx1262_companion_radio_ble]
extends = LilyGo_TWatch_S3_sx1262
build_flags =
  ${LilyGo_TWatch_S3_sx1262.build_flags}
  ${twatch_s3_tft.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
build_src_filter = ${LilyGo_TWatch_S3_sx1262.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${LilyGo_TWatch_S3_sx1262.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:LilyGo_TWatch_S3_sx1262_companion_radio_usb]
extends = LilyGo_TWatch_S3_sx1262
build_flags =
  ${LilyGo_TWatch_S3_sx1262.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_TWatch_S3_sx1262.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${LilyGo_TWatch_S3_sx1262.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TWatch_S3_sx1262_repeater]
extends = LilyGo_TWatch_S3_sx1262
build_flags =
  ${LilyGo_TWatch_S3_sx1262.build_flags}
  -D ADVERT_NAME='"TWatch S3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${LilyGo_TWatch_S3_sx1262.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TWatch_S3_sx1262.lib_deps}
  ${esp32_ota.lib_deps}

